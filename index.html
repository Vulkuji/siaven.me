      (function () {
        try {
          if (location.pathname !== "/") return;
          var saved = localStorage.getItem("siaven-lang");
          var browser = (navigator.language || "").toLowerCase();
          var lang = saved || (browser.indexOf("zh") === 0 ? "zh" : "en");
          if (lang === "en") location.replace("/en/" + location.hash);
        } catch (error) {}
      })();
    </script>
